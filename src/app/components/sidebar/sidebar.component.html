<ul *ngIf="contextMenuIsOpen" class="dropdown-menu" [ngStyle]="showContextMenu()">
  <li (click)="newFile()">New</li>
  <li [class.disabled]="selectedFiles.includes(idFileRightSelection) && selectedFiles.length !== 1" (click)="cloneFile()">Clone</li>
  <li [class.disabled]="selectedFiles.includes(idFileRightSelection) && selectedFiles.length !== 1" (click)="renameFile()">Rename</li>
  <li [class.disabled]="idFileRightSelection === 0 && selectedFiles.length === 0" (click)="deleteFile()">Delete</li>
</ul>
  
<div id="side_tabs">
    <span *ngFor="let icon of lateralIcons; let i = index" 
    [class.active]="lateralTab === icon.id" 
    class="material-symbols-outlined" 
    (click)="toggleLateralTab(icon.id)">
      {{icon.icon}}
    </span>
</div>

<div class="side_panel h-100 overflow-scroll" [class.d-none]="lateralTab !== 'tab_files'" id="tab_files">
  <div class="row g-0">
    <div class="col col-8">
      <h1>Files</h1>
    </div>

    <div class="col col-4 d-flex align-items-center justify-content-end">
      <span title="Close" class="fs-6 material-symbols-outlined" (click)="lateralTab = ''">
        close
      </span>
    </div>
  </div>

  <header>
    <div class="row g-0">
      <div class="col col-8">
        <input placeholder="Search" type="text" (input)="searchFile($event)">
      </div>

      <div class="col col-4 text-end">
        <button (click)="newFile()" title="New file">
          <span class="material-symbols-outlined">add</span>
        </button>
    
        <button (click)="deleteFile()" title="Delete file">
          <span class="material-symbols-outlined">remove</span>
        </button>
      </div>
    </div>
  </header>

  <ul (contextmenu)="onRightClick($event)">
    <li (contextmenu)="onRightClickFile($event, file.id)" *ngFor="let file of filteredFiles; let i = index"
        [class.selected]="selectedFiles.includes(file.id)"
        [class.border_right_selection]="contextMenuIsOpen && file.id === idFileRightSelection"
        (click)="openFile(file.id, $event)">
        <span class="material-symbols-outlined">draft</span> {{ file.name }} 
        <span [class.d-block]="file.unsavedChanges === true" title="Unsaved changes" class="material-symbols-outlined">warning</span>
  </ul>

</div>
